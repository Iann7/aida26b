<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Barcos</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">

       
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
            <svg class="logo-ancla" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:36px; height:36px; flex-shrink:0;">
                <circle cx="12" cy="5" r="2" />
                <line x1="12" y1="7" x2="12" y2="15" />
                <path d="M5 12a7 7 0 0 0 14 0" />
                <path d="M4 21h16" />
                <path d="M8 21v-3a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3" />
            </svg>
            <h1 id="app-title" style="margin: 0;">Sistema de Gestión de Barcos</h1>
        </div>

        <section id="auth-section" class="auth-section">
            <h2 id="login-title">Ingresar</h2>
            <form id="login-form">
                <div class="form-group">
                    <label id="login-username-label" for="login-username">Usuario</label>
                    <input id="login-username" name="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label id="login-password-label" for="login-password">Contraseña</label>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <p id="login-error" class="message" hidden></p>
                <button id="login-submit-btn" type="submit" class="add-btn">Ingresar</button>
            </form>
        </section>

        <section id="password-section" class="auth-section" style="display: none;">
            <h2 id="password-title">Cambiar contraseña</h2>
            <form id="password-form">
                <div class="form-group">
                    <label id="current-password-label" for="current-password">Contraseña actual</label>
                    <input id="current-password" name="current_password" type="password" required>
                </div>
                <div class="form-group">
                    <label id="new-password-label" for="new-password">Nueva contraseña</label>
                    <input id="new-password" name="new_password" type="password" minlength="8" required>
                </div>
                <p id="password-error" class="message" hidden></p>
                <button id="password-submit-btn" type="submit" class="add-btn">Actualizar</button>
            </form>
        </section>

        <div id="app-shell" style="display: none;">
            <div class="top-bar">
                <span id="current-user"></span>
                <button id="logout-btn" class="logout-btn">Salir</button>
            </div>

            <nav id='general-nav' class="nav">
                <nav id="table-nav" class="nav">
                </nav>
                <nav id="menu-nav" class='nav'>
                </nav>
            </nav>

            <div id="records-section" class="section active">
                <h2 id="view-title"></h2>
                <p id="status-message" class="message" hidden></p>
                <div class="toolbar">
                    <button id="add-record-btn" class="add-btn"></button>
                    <div id="admin-actions" class="admin-actions" hidden></div>
                </div>
                <div id="record-form" style="display: none;"></div>
                <table id="records-table">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
